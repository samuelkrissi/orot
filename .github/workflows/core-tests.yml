name: Core tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Run JVM catalog and HTML tests
        run: ./gradlew :core:test -PskipAndroid=true --no-daemon
